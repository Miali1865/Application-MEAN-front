<app-img-header
  [img_src]="'assets/img/photo4.jpg'"
  [titre]="'Nos Packs'"
  [description]="'Qualité et expertise : decouvrez nos pack pour votre auto.'"/>

<div class="grid grid-cols-1 md:grid-cols-3 gap-8">
<!--  {{packs.length}}-->
    @for (i of packs;track $index){
      <div class="service-card bg-white p-6 rounded shadow-lg transition-transform duration-300">
        <div class="w-12 h-12 flex items-center justify-center bg-primary/10 rounded-full mb-4">
          <i class="ri-car-fill text-primary ri-2x"></i>
        </div>
        <h3 class="text-xl font-semibold mb-3">{{i.name}}</h3>
        <p class="text-gray-600 mb-4">{{i.description}}</p>
<!--        TODO : asina redirection modal mipotra dia ny service by pack-->
        <button (click)="showDialog(i)" class="text-primary hover:text-primary/80 font-semibold cursor-pointer">Voir plus →</button>
      </div>
    }
  @if (pack_selected){
    <p-dialog header="Detail {{pack_selected.name}}" [modal]="true" [(visible)]="visible" [style]="{ width: '50rem' }">
      <span class="p-text-secondary block mb-8">{{pack_selected.description}}</span>

      <ul class="list-group">
        @for (i of pack_selected.services;track $index){
          <li class="list-group-item d-flex justify-content-between border-b">{{ i.name }}
            <span class="inline-flex items-center rounded-md bg-gray-50 px-2 py-1 text-xs font-medium text-gray-600 ring-1 ring-gray-500/10 ring-inset">
              {{i.estimatedTime}} min
            </span>
          </li>
        }
      </ul>
      <div class="flex justify-end gap-2">
        <p-button label="Annuler" severity="secondary" (click)="visible = false" />
<!--        todo : redirection page rdv si connecter sinon login-->
        <p-button label="Planifiez votre rendez-vous " (click)="visible = false" />
      </div>
    </p-dialog>

  }

</div>
