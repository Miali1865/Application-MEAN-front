<app-img-header
  [img_src]="'assets/img/photo3.jpg'"
  [titre]="'Nos services'"
  [description]="'Qualité et expertise : nos pack pour votre auto.'"/>

<div class="grid grid-cols-1 md:grid-cols-3 gap-8 px-6">
  @for (i of services;track $index){
    <div class="service-card bg-white p-6 rounded shadow-lg transition-transform duration-300">
      <div class="w-12 h-12 flex items-center justify-center bg-primary/10 rounded-full mb-4">
        <i class="text-primary ri-2x">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="m21.71 15.58l-4.52-4.51a7 7 0 0 0 .14-1.4A7.67 7.67 0 0 0 6.42 2.72a1 1 0 0 0-.57.74a1 1 0 0 0 .28.88l4.35 4.34l-1.8 1.8l-4.34-4.35a1 1 0 0 0-.88-.27a1 1 0 0 0-.74.56a7.67 7.67 0 0 0 7 10.91a7 7 0 0 0 1.4-.14l4.51 4.52a1 1 0 0 0 1.42 0a1 1 0 0 0 0-1.42l-4.9-4.9a1 1 0 0 0-.95-.26a6 6 0 0 1-1.48.2A5.67 5.67 0 0 1 4 9.67a6 6 0 0 1 .08-1L8 12.6a1 1 0 0 0 1.42 0l3.18-3.21a1 1 0 0 0 0-1.39L8.71 4.08a6 6 0 0 1 1-.08a5.67 5.67 0 0 1 5.66 5.67a6 6 0 0 1-.2 1.48a1 1 0 0 0 .26.95l4.9 4.9a1 1 0 0 0 1.42-1.42Z"/></svg>
        </i>
      </div>
      <h3 class="text-xl font-semibold mb-3">{{i.name}}</h3>
      <p class="text-gray-600 mb-4">{{i.description}}</p>
      <p class="text-primary font-semibold mb-4">A partir de {{i.basePrice | thousand}} Ar</p>
      <!--        todo : redirection page rdv si connecter sinon login-->
      <button class="text-primary hover:text-primary/80 font-semibold cursor-pointer">Prendre vous →</button>
    </div>

  }

</div>
