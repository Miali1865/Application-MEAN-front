<app-title-description
  [titre]="'Véhicules enregistrés'"
  [description]="'Base de données automobile - Accès aux historiques détaillés.'"/>


<div class="grid grid-cols-1 md:grid-cols-3 gap-8 px-6 py-4">
  @for (i of all_voitures;track $index){
    <div class="max-w-lg bg-white rounded-lg shadow-lg overflow-hidden service-card" (click)="showDialog_historique(i)">
      <div class="flex">
        <div class="w-1/3">
          <img class="w-full h-full object-cover rounded-l-lg" src="assets/img/photo3.jpg" alt="..." />
        </div>
        <div class="w-2/3 p-4">
          <h4 class="text-lg font-semibold">{{i.model}} <span class="text-grey">({{i.typeOfCar}})</span>
          </h4>
          <p class="text-gray-700 mt-2">
            This is a wider card with supporting text below as a natural lead-in to additional content. This content is a little bit longer.
          </p>
          <button  class="text-primary hover:text-primary/80 font-semibold cursor-pointer">Voir plus →</button>
        </div>
      </div>
    </div>
  }
</div>
